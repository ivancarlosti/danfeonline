; Fiscal Hub — PHP-FPM Pool Configuration
; Tuned for low-to-moderate traffic with Meu Danfe API proxy

[www]
user = phpuser
group = phpuser

listen = 127.0.0.1:9000
listen.owner = phpuser
listen.group = phpuser
listen.mode = 0660

; Process Manager — ondemand spawns children only when needed
pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Timeouts — generous enough for SEFAZ polling (up to 30s)
request_terminate_timeout = 60s

; Logging — send to stderr so Docker captures it
access.log = /dev/stderr
catch_workers_output = yes
decorate_workers_output = no

; Security hardening
php_admin_value[expose_php] = Off
php_admin_value[allow_url_include] = Off
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
