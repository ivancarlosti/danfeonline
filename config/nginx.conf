# Fiscal Hub — Nginx Site Configuration
# Serves as reverse proxy in front of PHP-FPM.
# Public paths bypass auth; everything else passes through router.php.

server {
    listen 8080;
    server_name _;

    root /app;

    # Security: deny access to hidden files and sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Public static files — served directly by nginx ──────
    location = /login.html {
        try_files /login.html =404;
    }

    location = /styles.css {
        try_files /styles.css =404;
    }

    # ── Public PHP endpoints — direct execution, no router ──
    location = /login.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/login.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /logout.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/logout.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # ── All other PHP files — routed through router.php ─────
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/router.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # ── All other requests — routed through router.php ──────
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/router.php;
        fastcgi_pass 127.0.0.1:9000;
    }
}
